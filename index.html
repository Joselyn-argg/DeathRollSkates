<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeathRoll Skates</title>
    <!--favicon-->
    <link rel="icon" href="./assets/img/favicon.png" />
    <!--Normalizador de css-->
    <link
      rel="stylesheet"
      href="https://unpkg.com/modern-normalize@2.0.0/modern-normalize.css"
    />
    <!--Mi css-->
    <link rel="stylesheet" href="./assets/style.css" />
    <!--Font Family-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome (para iconos) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="conteiner">
      <header>
        <img src="./assets/img/favicon.png" alt="Logo" loading="lazy" />
        <!--loading="lazy": Optimiza carga diferida de imágenes.-->
        <h1>DeathRoll Skates</h1>
      </header>
      <aside>
        <ul>
          <li>Categorías</li>
          <li>Patines <span>(55)</span></li>
          <li>Protecciones <span>(20)</span></li>
          <li>Accesorios <span>(11)</span></li>
          <li>Repuestos <span>(38)</span></li>
        </ul>
      </aside>
      <main>
        <!--Card 1-->
        <article class="card card1">
          <img
            src="./assets/img/rio-roller-beige1.png"
            alt="Patin Quad Rio Roller Beige"
            loading="lazy"
          />
          <div class="card-content">
            <h2>Patin Quad Rio Roller Beige</h2>
            <p>$31.000</p>
          </div>
        </article>
        <!--Card 2-->
        <article class="card card2">
          <img
            src="./assets/img/ufr-street-diako1.png"
            alt="Patin UFR Street Daiko"
            loading="lazy"
          />
          <div class="card-content">
            <h2>Patin UFR Street Daiko</h2>
            <p>$230.000</p>
          </div>
        </article>
        <!--Card 3-->
        <article class="card card3">
          <img
            src="./assets/img/fr3-blue.jpg"
            alt="Patin FR3 blue"
            loading="lazy"
          />
          <div class="card-content">
            <h2>Patin FR3 blue</h2>
            <p>$250.000</p>
          </div>
        </article>
        <!--Card 4-->
        <article class="card card4">
          <img
            src="./assets/img/sl-freeride.png"
            alt="Patin FR SL Freeride "
            loading="lazy"
          />
          <div class="card-content">
            <h2>Patin FR SL Freeride</h2>
            <p>$640.000</p>
          </div>
        </article>
        <!--Card 5-->
        <article class="card card4">
            <img
              src="./assets/img/sofia.jpg"
              alt="Patin FR Sofia"
              loading="lazy"
            />
            <div class="card-content">
              <h2>Patin FR Sofia</h2>
              <p>$680.000</p>
            </div>
          </article>
      </main>
      <footer>
        <p>Contactanos</p>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-solid fa-envelope"></i>
      </footer>
    </div>
  </body>
</html>
